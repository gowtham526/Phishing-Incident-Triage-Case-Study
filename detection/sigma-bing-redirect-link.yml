title: Email Link Wrapped In Bing Click Redirect
id: b01a25bf-8e8e-48ab-94a0-945fc33800e4
status: experimental
description: Detects email links that use a bing.com/ck/a click-tracking redirect, which hides the real destination from users and link filters. Seen in Phishing Case Study sample 2.
author: Katreddy Gowtham Kumar Reddy (gowtham526)
date: 2026/10/21
tags:
    - attack.initial_access
    - attack.t1566.002
logsource:
    category: email
detection:
    selection:
        url|contains: 'bing.com/ck/a'
    condition: selection
falsepositives:
    - Users legitimately sharing a copied Bing search result link
level: medium
